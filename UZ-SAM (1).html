<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UZ SAM TRANS</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#15243a;font:15px system-ui,sans-serif}aside{position:fixed;width:230px;inset:0 auto 0 0;background:#11263d;color:#fff;padding:32px 20px}.brand{font-size:26px;font-weight:800}.brand span{display:block;color:#50d4bb;font-size:14px;letter-spacing:6px}aside p{font-size:10px;color:#9eb3c8;margin:36px 0 15px}nav button{display:block;width:100%;text-align:left;background:none;color:#c3d0de;border:0;padding:14px;border-radius:8px;margin:5px 0}nav button.active{background:#21465b;color:#69e7cd}aside small{position:absolute;bottom:30px;color:#a7b9ca}main{margin-left:230px;padding:36px;max-width:1600px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}small{font-size:11px;letter-spacing:1px;color:#7c8b9d}h1{font-size:30px;margin:8px 0}button{cursor:pointer;border:1px solid #d5dfe8;border-radius:7px;background:white;color:#233e57;padding:10px 15px;font:inherit}header button,button[type=submit]{background:#087e70;color:white;border:0}.notice{font-size:13px;background:#e6f4f0;padding:13px;border-radius:8px;margin-bottom:22px}#summary{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}.card,.panel{background:white;border:1px solid #e1e7ee;border-radius:12px}.card{padding:22px}.card strong{display:block;font-size:26px;margin-top:10px}.card span{color:#6a7b8c;font-size:13px}.panel{padding:20px;overflow:auto;min-height:260px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}input,select{border:1px solid #ced9e3;border-radius:6px;padding:10px;font:inherit;max-width:100%}input[type=date]{padding:8px;width:145px}.toolbar label{font-size:12px;color:#64768a}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #edf0f4}th{font-size:11px;text-transform:uppercase;color:#7d8b9e}td button{padding:5px 9px;font-size:12px;margin-right:5px}.empty{text-align:center;padding:55px 15px;color:#718399}footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}footer span{font-size:13px;align-self:center}dialog{border:0;border-radius:14px;padding:26px;width:480px;max-width:95vw}dialog::backdrop{background:#10203988}#fields{display:grid;gap:12px}#fields label{font-size:13px}#fields input,#fields select{display:block;width:100%;margin-top:5px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}#error{color:#ba283f}.badge{background:#e6f4f0;color:#087e70;padding:5px 8px;border-radius:5px;font-size:12px}@media(max-width:850px){aside{position:static;width:auto;padding:20px}aside p,aside small{display:none}.brand span{display:inline;letter-spacing:2px;margin-left:8px}nav{display:flex;overflow:auto;margin-top:15px}nav button{width:auto;white-space:nowrap;margin:0}main{margin:0;padding:20px}#summary{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:flex-start;flex-direction:column}h1{font-size:24px}.card{padding:15px}.card strong{font-size:22px}}
</style><body><aside><div class="brand">UZ SAM <span>TRANS</span></div><p>TRANSPORT BOSHQARUVI</p><nav id="nav"></nav><small>USD · Mahalliy saqlash</small></aside><main><header><div><small>UZ SAM TRANS / BOSHQARUV</small><h1 id="title"></h1></div><button id="add">+ Yangi yozuv</button></header><div class="notice">Ma’lumotlar shu brauzerda saqlanadi. Qurilmalar o‘rtasida sinxronlash yo‘q. Muntazam zaxira oling.</div><section id="summary"></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Qidirish…" aria-label="Qidirish"><label>Hisobot: <input type="date" id="from"> — <input type="date" id="to"></label></div><div id="content"></div></section><footer><button id="export">Zaxira olish (JSON)</button><button id="import">Zaxirani tiklash</button><button id="csv">CSV yuklash</button><input id="file" type="file" accept=".json" hidden><span id="message" role="status"></span></footer></main><dialog id="dialog"><form id="form"><h2 id="formTitle"></h2><div id="fields"></div><p id="error" role="alert"></p><div class="actions"><button type="button" id="cancel">Bekor qilish</button><button type="submit">Saqlash</button></div></form></dialog><script>'use strict';
const KEY='uzsam-v1';
const schemas={trucks:{title:'Trucklar',fields:[['number','Truck raqami','text'],['plate','Davlat raqami','text'],['status','Holati',['Faol','Ta’mirda','Bo‘sh']]]},drivers:{title:'Haydovchilar',fields:[['name','Ism','text'],['phone','Telefon','tel'],['truck','Truck','ref:trucks']]},dispatchers:{title:'Dispatcherlar',fields:[['name','Ism','text'],['phone','Telefon','tel'],['percent','Dispatch foizi','number']]},loads:{title:'Yuklar',fields:[['number','Load raqami','text'],['date','Sana','date'],['origin','Qayerdan','text'],['destination','Qayerga','text'],['truck','Truck','ref:trucks'],['driver','Haydovchi','ref:drivers'],['dispatcher','Dispatcher','ref:dispatchers'],['rate','Kelishilgan narx ($)','number'],['status','Holati',['Rejada','Yo‘lda','Yetkazildi']]]},income:{title:'Daromad',fields:[['date','To‘lov sanasi','date'],['load','Load','ref:loads'],['amount','Olingan summa ($)','number'],['note','Izoh','text']]},expenses:{title:'Xarajatlar',fields:[['date','Sana','date'],['truck','Truck','ref:trucks'],['category','Turi',['Yoqilg‘i','Ta’mir','Sug‘urta','Haydovchi to‘lovi','Dispatch','Boshqa']],['amount','Summa ($)','number'],['note','Izoh','text']]}};
const blank=()=>Object.fromEntries(Object.keys(schemas).map(k=>[k,[]]));
let data=blank(),page='dashboard',editing=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
function valid(d){return d&&Object.keys(schemas).every(k=>Array.isArray(d[k])&&d[k].every(r=>r&&typeof r.id==='string'&&schemas[k].fields.every(([f,l,t])=>typeof r[f]===(t==='number'?'number':'string')&&(t!=='number'||Number.isFinite(r[f])&&r[f]>=0)&&(Array.isArray(t)?t.includes(r[f]):true))));}
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!valid(parsed))throw Error();data=parsed;}}catch{$('message').textContent='Saqlangan ma’lumot ochilmadi. Zaxiradan tiklang.';}
function commit(next){try{localStorage.setItem(KEY,JSON.stringify(next));data=next;return true;}catch{$('message').textContent='Saqlash amalga oshmadi. Brauzer xotirasini tekshiring.';return false;}}
function label(key,id){const r=data[key].find(r=>r.id===id);return r?(r.name||r.number):'—';}
function value(r,f,t){if(typeof t==='string'&&t.startsWith('ref:'))return label(t.slice(4),r[f]);if(['rate','amount'].includes(f))return money(r[f]);return r[f];}
function filtered(key){const q=$('search').value.toLowerCase();return data[key].filter(r=>(!r.date||(!$('from').value||r.date>=$('from').value)&&(!$('to').value||r.date<=$('to').value))&&schemas[key].fields.some(([f,l,t])=>String(value(r,f,t)).toLowerCase().includes(q)));}
function sum(key){return data[key].filter(r=>(!$('from').value||r.date>=$('from').value)&&(!$('to').value||r.date<=$('to').value)).reduce((n,r)=>n+r.amount,0);}
function table(key,rows){const fields=schemas[key].fields;return rows.length?`<table><thead><tr>${fields.map(f=>`<th>${esc(f[1])}</th>`).join('')}<th>Amallar</th></tr></thead><tbody>${rows.map(r=>`<tr>${fields.map(([f,l,t])=>`<td>${esc(value(r,f,t))}</td>`).join('')}<td><button data-edit="${esc(r.id)}" data-key="${key}">Tahrir</button><button data-delete="${esc(r.id)}" data-key="${key}">O‘chirish</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Hozircha yozuv yo‘q. “Yangi yozuv” orqali boshlang.</div>';}
function render(){ $('title').textContent=page==='dashboard'?'Umumiy ko‘rinish':schemas[page].title;$('add').hidden=page==='dashboard';$('nav').innerHTML=[['dashboard','Umumiy ko‘rinish'],...Object.entries(schemas).map(([k,s])=>[k,s.title])].map(([k,t])=>`<button data-page="${k}" class="${page===k?'active':''}">${t}</button>`).join('');const inc=sum('income'),out=sum('expenses');$('summary').innerHTML=[['Trucklar',data.trucks.length],['Olingan daromad',money(inc)],['Xarajatlar',money(out)],['Pul oqimi farqi',money(inc-out)]].map(([t,v])=>`<div class="card"><span>${t}</span><strong>${v}</strong></div>`).join('');$('content').innerHTML=page==='dashboard'?`<h3>Yuklar</h3><p>Daromad faqat kiritilgan to‘lovlardan hisoblanadi. Sana filtri to‘lov va xarajat sanalariga qo‘llanadi.</p>${table('loads',filtered('loads'))}`:table(page,filtered(page));}
function openForm(key,id){page=key;editing=id||null;const row=id?data[key].find(r=>r.id===id):{};$('formTitle').textContent=schemas[key].title+' — '+(id?'tahrirlash':'yangi');$('fields').innerHTML=schemas[key].fields.map(([f,l,t])=>{let field;if(Array.isArray(t))field=`<select name="${f}">${t.map(v=>`<option ${row[f]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`;else if(t.startsWith('ref:')){const ref=t.slice(4);field=`<select name="${f}"><option value="">Tanlanmagan</option>${data[ref].map(r=>`<option value="${esc(r.id)}" ${row[f]===r.id?'selected':''}>${esc(r.name||r.number)}</option>`).join('')}</select>`;}else field=`<input name="${f}" type="${t}" value="${esc(row[f]??(t==='date'?new Date().toLocaleDateString('en-CA'):''))}" ${['note','phone','plate'].includes(f)?'':'required'} ${t==='number'?`min="0" step="0.01" ${f==='percent'?'max="100"':''}`:''}>`;return `<label>${esc(l)}${field}</label>`;}).join('');$('error').textContent='';$('dialog').showModal();}
$('nav').onclick=e=>{if(e.target.dataset.page){page=e.target.dataset.page;$('search').value='';render();}};
$('add').onclick=()=>openForm(page);$('cancel').onclick=()=>$('dialog').close();
$('form').onsubmit=e=>{e.preventDefault();const row={id:editing||crypto.randomUUID()};const fd=new FormData(e.target);for(const [f,l,t]of schemas[page].fields)row[f]=t==='number'?Number(fd.get(f)):String(fd.get(f)||'').trim();if(['trucks','loads'].includes(page)&&data[page].some(r=>r.id!==row.id&&r.number.toLowerCase()===row.number.toLowerCase())){$('error').textContent='Bu raqam allaqachon mavjud.';return;}if(!valid({...data,[page]:[row]})){$('error').textContent='Ma’lumotlarni tekshiring.';return;}const next={...data,[page]:editing?data[page].map(r=>r.id===editing?row:r):[...data[page],row]};if(commit(next)){$('dialog').close();render();}};
$('content').onclick=e=>{const b=e.target.closest('button');if(!b)return;const key=b.dataset.key;if(b.dataset.edit)openForm(key,b.dataset.edit);if(b.dataset.delete){const id=b.dataset.delete;const used=Object.entries(schemas).some(([k,s])=>s.fields.some(([f,l,t])=>t===`ref:${key}`&&data[k].some(r=>r[f]===id)));if(used){alert('Bu yozuv boshqa yozuvga bog‘langan. Avval bog‘lanishni olib tashlang.');return;}if(confirm('Yozuv o‘chirilsinmi?')){if(commit({...data,[key]:data[key].filter(r=>r.id!==id)}))render();}}};
for(const id of ['search','from','to'])$(id).oninput=render;
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('export').onclick=()=>download('UZ-SAM-backup.json',JSON.stringify(data,null,2),'application/json');
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const next=JSON.parse(await file.text());if(!valid(next))throw Error('Zaxira fayli formati noto‘g‘ri.');for(const [k,s]of Object.entries(schemas)){if(new Set(next[k].map(r=>r.id)).size!==next[k].length)throw Error('Takroriy ID mavjud.');for(const r of next[k])for(const [f,l,t]of s.fields)if(typeof t==='string'&&t.startsWith('ref:')&&r[f]&&!next[t.slice(4)].some(x=>x.id===r[f]))throw Error('Bog‘lanish topilmadi.');}if(confirm('Hozirgi ma’lumotlar zaxira bilan almashtirilsinmi? Avval zaxira olish tavsiya etiladi.')){if(commit(next)){render();$('message').textContent='Zaxira tiklandi.';}}}catch(err){$('message').textContent=err.message||'Fayl ochilmadi.';}e.target.value='';};
$('csv').onclick=()=>{const key=page==='dashboard'?'loads':page;const fields=schemas[key].fields;const cell=x=>'"'+String(x??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';download(`UZ-SAM-${key}.csv`,'\uFEFF'+[fields.map(f=>f[1]),...filtered(key).map(r=>fields.map(([f,l,t])=>value(r,f,t)))].map(row=>row.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');};
render();
</script></body></html>
